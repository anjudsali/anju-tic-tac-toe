
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anju's Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>ANJU'S ARCADE</h1>
    <p class="subtitle">TIC TAC TOE · PLAYER VS COMPUTER</p>

    <div class="scores">
      <div>You (X)<strong id="playerScore">0</strong></div>
      <div>Computer (O)<strong id="computerScore">0</strong></div>
      <div>Draws<strong id="drawScore">0</strong></div>
    </div>

    <p id="status">Your turn! Choose a square.</p>

    <div class="board" id="board">
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
    </div>

    <button id="newGame">NEW GAME</button>
    <button id="reset">RESET SCORES</button>

    <footer>Designed & Developed by Anju 💜</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
